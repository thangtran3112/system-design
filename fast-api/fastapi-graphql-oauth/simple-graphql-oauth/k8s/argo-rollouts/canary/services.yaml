apiVersion: v1
kind: Service
metadata:
  name: graphql-todo-stable
  namespace: graphql-todo
spec:
  type: ClusterIP
  selector:
    app: graphql-todo
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: graphql-todo-canary
  namespace: graphql-todo
spec:
  type: ClusterIP
  selector:
    app: graphql-todo
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
