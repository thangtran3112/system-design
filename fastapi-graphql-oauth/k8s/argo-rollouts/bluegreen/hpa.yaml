apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: graphql-todo-bluegreen
  namespace: graphql-todo
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: graphql-todo-bluegreen
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
