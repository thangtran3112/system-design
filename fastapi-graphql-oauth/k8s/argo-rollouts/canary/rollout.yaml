apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: graphql-todo-canary
  namespace: graphql-todo
  labels:
    app: graphql-todo
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: graphql-todo
  template:
    metadata:
      labels:
        app: graphql-todo
    spec:
      containers:
        - name: graphql-todo
          image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/graphql-todo:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: graphql-todo-config
          env:
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: graphql-todo-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: graphql-todo-secrets
                  key: GOOGLE_CLIENT_SECRET
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: graphql-todo-secrets
                  key: JWT_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: graphql-todo-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
  strategy:
    canary:
      stableService: graphql-todo-stable
      canaryService: graphql-todo-canary
      trafficRouting:
        alb:
          ingress: graphql-todo-canary
          servicePort: 80
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 10
        - pause:
            duration: 60s
        - setWeight: 30
        - pause:
            duration: 120s
        - setWeight: 60
        - pause:
            duration: 120s
        - setWeight: 100
