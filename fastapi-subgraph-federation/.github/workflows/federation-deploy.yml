name: federation-deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
      image_tag:
        description: "Image tag to deploy (example: a1b2c3d4e5f6)"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        shell: bash
    env:
      NAMESPACE: graphql-federation-${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name "${{ secrets.EKS_CLUSTER_NAME }}" --region "${{ secrets.AWS_REGION }}"

      - name: Ensure namespace exists
        run: |
          kubectl get namespace "$NAMESPACE" >/dev/null 2>&1 || kubectl create namespace "$NAMESPACE"

      - name: Apply base manifests
        run: |
          for file in \
            configmap.yaml \
            secrets.yaml \
            users-deployment.yaml \
            users-service.yaml \
            todos-deployment.yaml \
            todos-service.yaml \
            router-deployment.yaml \
            router-service.yaml \
            ingress.yaml \
            users-hpa.yaml \
            todos-hpa.yaml \
            router-hpa.yaml; do
            sed "s/namespace: graphql-federation/namespace: ${NAMESPACE}/g" "fastapi-subgraph-federation/k8s/${file}" | kubectl apply -f -
          done

      - name: Apply supergraph configmap
        run: |
          kubectl -n "$NAMESPACE" create configmap router-supergraph \
            --from-file=supergraph.graphql=fastapi-subgraph-federation/k8s/router-supergraph.graphql \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Update workload images
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          ECR_USERS_REPO: ${{ secrets.ECR_USERS_REPO }}
          ECR_TODOS_REPO: ${{ secrets.ECR_TODOS_REPO }}
          ECR_ROUTER_REPO: ${{ secrets.ECR_ROUTER_REPO }}
        run: |
          kubectl -n "$NAMESPACE" set image deployment/users users="${ECR_USERS_REPO}:${IMAGE_TAG}"
          kubectl -n "$NAMESPACE" set image deployment/todos todos="${ECR_TODOS_REPO}:${IMAGE_TAG}"
          if [[ -n "$ECR_ROUTER_REPO" ]]; then
            kubectl -n "$NAMESPACE" set image deployment/router router="${ECR_ROUTER_REPO}:${IMAGE_TAG}"
          fi

      - name: Restart router to pick up supergraph
        run: kubectl -n "$NAMESPACE" rollout restart deployment/router

      - name: Wait for rollouts
        run: |
          kubectl -n "$NAMESPACE" rollout status deployment/users --timeout=300s
          kubectl -n "$NAMESPACE" rollout status deployment/todos --timeout=300s
          kubectl -n "$NAMESPACE" rollout status deployment/router --timeout=300s

      - name: Smoke test via router
        run: |
          kubectl -n "$NAMESPACE" port-forward service/router-service 4000:80 > /tmp/port-forward.log 2>&1 &
          for _ in {1..20}; do
            if curl -sf "http://127.0.0.1:4000/" > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -sS -X POST "http://127.0.0.1:4000/" \
            -H "content-type: application/json" \
            --data '{"query":"query { __typename }"}' \
            | python -c "import json,sys; payload=json.load(sys.stdin); assert 'errors' not in payload"
