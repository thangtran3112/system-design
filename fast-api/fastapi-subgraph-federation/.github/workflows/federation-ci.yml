name: federation-ci

on:
  pull_request:
    paths:
      - "fastapi-subgraph-federation/**"
      - ".github/workflows/federation-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r fastapi-subgraph-federation/requirements-dev.txt
          python -m pip install -r fastapi-subgraph-federation/services/users/requirements.txt
          python -m pip install -r fastapi-subgraph-federation/services/todos/requirements.txt

      - name: Install Rover and Apollo Router
        run: |
          curl -sSL https://rover.apollo.dev/nix/latest | sh
          curl -sSL https://router.apollo.dev/download/nix/latest | sh
          echo "$HOME/.rover/bin" >> "$GITHUB_PATH"
          echo "$HOME/.router/bin" >> "$GITHUB_PATH"

      - name: Start users subgraph
        working-directory: fastapi-subgraph-federation/services/users
        run: nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 > /tmp/users.log 2>&1 &

      - name: Start todos subgraph
        working-directory: fastapi-subgraph-federation/services/todos
        run: nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8002 > /tmp/todos.log 2>&1 &

      - name: Wait for subgraphs
        run: |
          for url in http://127.0.0.1:8001/health http://127.0.0.1:8002/health; do
            for _ in {1..40}; do
              if curl -sf "$url" > /dev/null; then
                break
              fi
              sleep 1
            done
            curl -sf "$url" > /dev/null
          done

      - name: Compose supergraph
        working-directory: fastapi-subgraph-federation
        run: ./scripts/compose_supergraph.sh

      - name: Start router
        working-directory: fastapi-subgraph-federation
        run: |
          ROUTER_BIN="$(command -v router || true)"
          if [[ -z "$ROUTER_BIN" && -x "$HOME/.router/bin/router" ]]; then
            ROUTER_BIN="$HOME/.router/bin/router"
          fi
          if [[ -z "$ROUTER_BIN" ]]; then
            echo "Router binary not found" >&2
            exit 1
          fi
          nohup "$ROUTER_BIN" --supergraph router/supergraph.graphql --dev > /tmp/router.log 2>&1 &

      - name: Wait for router
        run: |
          for url in http://127.0.0.1:8088/health http://127.0.0.1:4000/; do
            for _ in {1..40}; do
              if curl -sf "$url" > /dev/null; then
                break
              fi
              sleep 1
            done
            curl -sf "$url" > /dev/null
          done

      - name: Run federation tests
        working-directory: fastapi-subgraph-federation
        run: pytest -q

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: federation-ci-logs
          path: |
            /tmp/users.log
            /tmp/todos.log
            /tmp/router.log
