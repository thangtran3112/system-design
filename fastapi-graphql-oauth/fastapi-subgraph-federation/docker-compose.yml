services:
  users:
    build: ./services/users
    ports:
      - "8001:8000"
    environment:
      USERS_DATABASE_URL: sqlite:///./users.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  todos:
    build: ./services/todos
    ports:
      - "8002:8000"
    environment:
      TODOS_DATABASE_URL: sqlite:///./todos.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  router:
    image: ghcr.io/apollographql/router:v2.0.0
    ports:
      - "4000:4000"
    volumes:
      - ./router/supergraph.graphql:/etc/config/supergraph.graphql
    command:
      - --supergraph
      - /etc/config/supergraph.graphql
      - --dev
    depends_on:
      users:
        condition: service_healthy
      todos:
        condition: service_healthy
